<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level 2: Native Automata Skirmish</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div class="brand">
          <h1>Level 2: Native Automata Skirmish</h1>
          <p>Hotseat automata roster battle</p>
        </div>
        <button id="newGame" class="command" type="button">Start Game</button>
        <button id="resetSetup" class="command" type="button">Reset</button>
      </header>

      <section id="setup" class="setup">
        <section class="roster-panel">
          <h2>Player A Depot</h2>
          <div id="rosterA" class="roster-grid"></div>
        </section>
        <section class="roster-panel">
          <h2>Player B Depot</h2>
          <div id="rosterB" class="roster-grid"></div>
        </section>
      </section>

      <section id="gameView" class="game-view hidden">
        <section class="arena">
          <canvas id="grid" width="768" height="768" aria-label="Toroidal skirmish grid"></canvas>
        </section>

        <aside class="side-panel">
          <section class="status-strip">
            <div>
              <span class="label">Turn</span>
              <strong id="turnLabel">-</strong>
            </div>
            <div>
              <span class="label">Biomass</span>
              <strong id="biomassLabel">-</strong>
            </div>
            <div>
              <span class="label">Result</span>
              <strong id="resultLabel">-</strong>
            </div>
          </section>

          <section class="direction-panel">
            <span class="label">Deploy Direction</span>
            <div class="direction-buttons">
              <button class="dir-button active" data-dir="0" type="button">N</button>
              <button class="dir-button" data-dir="1" type="button">E</button>
              <button class="dir-button" data-dir="2" type="button">S</button>
              <button class="dir-button" data-dir="3" type="button">W</button>
            </div>
          </section>

          <section class="players">
            <div class="player-column">
              <h2>Player A</h2>
              <div id="piecesA" class="piece-list"></div>
            </div>
            <div class="player-column">
              <h2>Player B</h2>
              <div id="piecesB" class="piece-list"></div>
            </div>
          </section>

          <p id="message" class="message">Choose rosters and start.</p>
        </aside>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
